<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="View PCDealHub deals you saved in this browser. Free local saved-deal list for PC hardware shopping in India."><link rel="canonical" href="https://tarotgamerz.github.io/pcdealhub/saved-deals.html"><title>Saved Deals | PCDealHub</title><style>:root{--bg:#070b16;--text:#eef2ff;--muted:#9aa8c3;--line:#24324f;--a:#8c7cff;--b:#5d7cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;line-height:1.7}.wrap{width:min(1000px,92%);margin:auto}main{padding:45px 0 80px}a{color:#b9b0ff}.box{background:#10182a;border:1px solid var(--line);border-radius:22px;padding:30px}h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:.98;letter-spacing:-.05em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:25px}.card{padding:20px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#111a2e,#0a101e)}.tag{font-size:.75rem;border:1px solid #334261;border-radius:999px;padding:4px 8px}.price{font-size:1.6rem;font-weight:900;margin:7px 0}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-decoration:none;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="index.html">← PCDealHub</a><div class="box"><h1>Saved Deals</h1><p class="muted">Saved deals live only in this browser. No account or email is required.</p><div id="out"></div><p style="margin-top:25px"><a href="deals.html">Browse all deals →</a> · <a href="start-here.html">Start Here →</a></p></div></main><script>const out=document.getElementById("out"),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]||c));const saved=new Set(JSON.parse(localStorage.getItem("pcdealhub-saved")||"[]"));fetch("deals.json?v="+Date.now()).then(r=>r.json()).then(deals=>{const x=deals.filter(d=>saved.has(d.id));if(!x.length){out.innerHTML='<div class="card"><strong>No saved deals yet.</strong><div class="muted">Open the deals page and use “Save deal” on a listing.</div></div>';return}out.innerHTML='<div class="grid">'+x.map(d=>'<article class="card"><span class="tag">'+esc(d.category)+'</span><h2>'+esc(d.name)+'</h2><div class="price">₹'+Number(d.price).toLocaleString("en-IN")+'</div><div class="muted">Seller: '+esc(d.seller)+' · '+esc(d.stock||"See listing")+'</div><a class="btn" href="deals.html#'+encodeURIComponent(d.id)+'">Open saved deal →</a></article>').join("")+'</div>'}).catch(()=>out.innerHTML='<div class="card">Deal feed unavailable right now.</div>')</script></body></html>
