name: Sync deal candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/sync_cuelinks.py"
      - ".github/workflows/sync-deals.yml"

permissions:
  contents: write

concurrency:
  group: deal-candidate-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cuelinks configuration
        id: config
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$CUELINKS_API_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CUELINKS_API_KEY is not configured; candidate sync will be skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cuelinks API key is configured."
          fi

      - name: Sync Cuelinks candidates
        if: steps.config.outputs.configured == 'true'
        env:
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: python3 scripts/sync_cuelinks.py

      - name: Commit candidate queue when changed
        if: steps.config.outputs.configured == 'true'
        run: |
          git config user.name "pcdealhub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cuelinks-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh deal candidate queue"
          git push
