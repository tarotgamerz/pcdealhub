name: PCDealHub Operator CI

on:
  push:
    paths:
      - "operator/**"
      - ".github/workflows/operator-ci.yml"
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/operator-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Build Eve
        run: npm run eve:build

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
