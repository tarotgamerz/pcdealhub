name: Validate PCDealHub Operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/operator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js console
        run: npm run build

      - name: Build Eve runtime
        run: npm run build:eve
