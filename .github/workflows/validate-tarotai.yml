name: Validate tarotai runtime

on:
  push:
    paths:
      - "tarotai-live/**"
      - ".github/workflows/validate-tarotai.yml"
  pull_request:
    paths:
      - "tarotai-live/**"
      - ".github/workflows/validate-tarotai.yml"

jobs:
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tarotai-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tarotai-live/package.json
      - name: Install dependencies
        run: npm install
      - name: Tool contract checks
        run: node scripts/check_tools.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
