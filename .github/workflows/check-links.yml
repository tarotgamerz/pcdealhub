name: Check PCDealHub deal links

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
  push:
    branches: [main]
    paths:
      - "deals.json"
      - "scripts/check_deal_links.py"
      - ".github/workflows/check-links.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deal-link rules
        run: python3 scripts/check_deal_links.py

      - name: Check published deal URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request
          from pathlib import Path

          data = json.loads(Path("deals.json").read_text(encoding="utf-8"))
          failures = []
          checked = 0

          for deal in data:
              url = deal.get("affiliate_url") or deal.get("url")
              if not url:
                  continue
              checked += 1
              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; PCDealHub-LinkCheck/1.0)",
                      "Range": "bytes=0-1023",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status >= 400:
                          failures.append(f"{deal.get('id')}: HTTP {response.status} {url}")
              except Exception as exc:
                  message = str(exc)
                  if "HTTP Error 403" in message or "HTTP Error 429" in message:
                      print(f"WARN {deal.get('id')}: retailer blocked automated check ({message})")
                  else:
                      failures.append(f"{deal.get('id')}: {message}")

          print(f"Checked {checked} published link(s).")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY
