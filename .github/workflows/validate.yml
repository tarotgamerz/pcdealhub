name: Validate PCDealHub

on:
  push:
    branches: ["main"]
    paths:
      - "deals.json"
      - "deals.schema.json"
      - "index.html"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "deals.json"
      - "deals.schema.json"
      - "index.html"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository files
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl -fsSL "$base/deals.json" -o deals.json
          curl -fsSL "$base/deals.schema.json" -o deals.schema.json
          curl -fsSL "$base/index.html" -o index.html

      - name: Validate deals JSON
        run: python3 - <<'PY'
import json
from urllib.parse import urlparse
from datetime import datetime
from pathlib import Path

data=json.loads(Path("deals.json").read_text(encoding="utf-8"))
json.loads(Path("deals.schema.json").read_text(encoding="utf-8"))
if not isinstance(data,list):
    raise SystemExit("deals.json must contain an array")

required=["id","name","category","price","reference","score","seller","url","checked_at","condition","verification"]
cats={"GPU","CPU","RAM","SSD","PC","MONITOR"}

for i,d in enumerate(data,1):
    missing=[k for k in required if k not in d]
    if missing: raise SystemExit(f"Deal {i}: missing {missing}")
    if d["category"] not in cats: raise SystemExit(f"Deal {i}: invalid category")
    if not isinstance(d["price"],(int,float)) or d["price"]<=0: raise SystemExit(f"Deal {i}: invalid price")
    if not isinstance(d["reference"],(int,float)) or d["reference"]<=0: raise SystemExit(f"Deal {i}: invalid reference price")
    if not 0 <= float(d["score"]) <= 10: raise SystemExit(f"Deal {i}: score must be between 0 and 10")
    p=urlparse(d["url"])
    if p.scheme not in {"http","https"} or not p.netloc: raise SystemExit(f"Deal {i}: invalid URL")
    datetime.fromisoformat(d["checked_at"].replace("Z","+00:00"))
    for k in ["price","seller","availability","terms"]:
        if d["verification"].get(k) is not True:
            raise SystemExit(f"Deal {i}: verification.{k} must be true")
print(f"Validated {len(data)} verified deal(s).")
PY

      - name: Basic HTML checks
        run: python3 - <<'PY'
from pathlib import Path
html=Path("index.html").read_text(encoding="utf-8")
for needle in ["deals.json","affiliate-disclosure.html","privacy.html","terms.html","contact.html","deals.html","guides/index.html"]:
    if needle not in html:
        raise SystemExit(f"Missing expected link/reference: {needle}")
print("Basic HTML checks passed.")
PY
