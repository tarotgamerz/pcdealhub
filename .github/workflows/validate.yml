name: Validate PCDealHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deal JSON and schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from datetime import datetime

          data = json.loads(Path("deals.json").read_text(encoding="utf-8"))
          json.loads(Path("deals.schema.json").read_text(encoding="utf-8"))

          if not isinstance(data, list):
              raise SystemExit("deals.json must contain an array")

          required = ["id","name","category","price","reference","score","seller","url","checked_at","condition","verification"]
          cats = {"GPU","CPU","RAM","SSD","PC","MONITOR"}

          for i, deal in enumerate(data, 1):
              missing = [k for k in required if k not in deal]
              if missing:
                  raise SystemExit(f"Deal {i}: missing {missing}")
              if deal["category"] not in cats:
                  raise SystemExit(f"Deal {i}: invalid category")
              if not isinstance(deal["price"], (int, float)) or deal["price"] <= 0:
                  raise SystemExit(f"Deal {i}: invalid price")
              if not isinstance(deal["reference"], (int, float)) or deal["reference"] <= 0:
                  raise SystemExit(f"Deal {i}: invalid reference")
              if not 0 <= float(deal["score"]) <= 10:
                  raise SystemExit(f"Deal {i}: invalid score")
              parsed = urlparse(deal["url"])
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit(f"Deal {i}: invalid URL")
              datetime.fromisoformat(deal["checked_at"].replace("Z", "+00:00"))
              for key in ("price", "seller", "availability", "terms"):
                  if deal.get("verification", {}).get(key) is not True:
                      raise SystemExit(f"Deal {i}: verification.{key} must be true")

          print(f"Validated {len(data)} verified deal(s).")
          PY

      - name: Basic homepage checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "deals.json",
              "affiliate-disclosure.html",
              "privacy.html",
              "terms.html",
              "contact.html",
              "deals.html",
              "guides/index.html",
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f"Missing expected homepage references: {missing}")
          print("Homepage checks passed.")
          PY
