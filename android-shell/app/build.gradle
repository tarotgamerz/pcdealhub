plugins {
    id "com.android.application"
}

def appVersionCode = (project.findProperty("APP_VERSION_CODE") ?: "1").toString().toInteger()
def appVersionName = (project.findProperty("APP_VERSION_NAME") ?: "0.1.0").toString()

android {
    namespace "com.tarotai.mobile"
    compileSdk 36

    defaultConfig {
        applicationId "com.tarotai.mobile"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
}
