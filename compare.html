<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Free PCDealHub price comparison tool for verified PC hardware listings in India. Compare price, saving, seller and warranty."><link rel="canonical" href="https://tarotgamerz.github.io/pcdealhub/compare.html"><title>Compare PC Hardware Prices | Free Tool | PCDealHub</title><style>:root{--bg:#070b16;--text:#eef2ff;--muted:#9aa8c3;--line:#24324f;--a:#8c7cff;--b:#5d7cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;line-height:1.65}.wrap{width:min(1000px,92%);margin:auto}main{padding:45px 0 80px}.box{background:#10182a;border:1px solid var(--line);border-radius:22px;padding:30px}h1{font-size:clamp(2.4rem,6vw,4.6rem);line-height:.98;letter-spacing:-.05em}a{color:#b9b0ff}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}select{width:100%;padding:13px;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:10px}.table{margin-top:24px;overflow:auto}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.head{font-weight:900}.good{font-weight:900}.muted{color:var(--muted)}@media(max-width:700px){.controls{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="box"><a href="index.html">← PCDealHub</a><h1>Compare PC Hardware Prices</h1><p class="muted">Pick two verified listings from the current PCDealHub feed. This comparison uses the exact model data stored in the feed.</p><div class="controls"><label>First product<select id="a"></select></label><label>Second product<select id="b"></select></label></div><div id="out" class="table"></div><p><a href="deals.html">All verified deals →</a> · <a href="build-planner.html">Build Planner →</a></p></div></main><script>let deals=[];const money=n=>"₹"+Number(n).toLocaleString("en-IN");const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]||c));const A=document.getElementById("a"),B=document.getElementById("b"),out=document.getElementById("out");function fill(){const opts=deals.map((d,i)=>'<option value="'+i+'">'+esc(d.name)+' — '+money(d.price)+'</option>').join("");A.innerHTML=opts;B.innerHTML=opts;if(deals.length>1)B.selectedIndex=1;render()}function render(){const x=deals[Number(A.value)||0],y=deals[Number(B.value)||0];if(!x||!y){out.innerHTML='<div class="row">Not enough verified listings to compare yet.</div>';return}out.innerHTML='<div class="row head"><div>Attribute</div><div>Product A</div><div>Product B</div></div><div class="row"><div>Name</div><div>'+esc(x.name)+'</div><div>'+esc(y.name)+'</div></div><div class="row"><div>Price</div><div class="good">'+money(x.price)+'</div><div class="good">'+money(y.price)+'</div></div><div class="row"><div>Reference</div><div>'+money(x.reference)+'</div><div>'+money(y.reference)+'</div></div><div class="row"><div>Potential saving</div><div>'+money(x.reference-x.price)+'</div><div>'+money(y.reference-y.price)+'</div></div><div class="row"><div>Seller</div><div>'+esc(x.seller)+'</div><div>'+esc(y.seller)+'</div></div><div class="row"><div>Stock</div><div>'+esc(x.stock||"See listing")+'</div><div>'+esc(y.stock||"See listing")+'</div></div><div class="row"><div>Warranty</div><div>'+esc(x.warranty||"See listing")+'</div><div>'+esc(y.warranty||"See listing")+'</div></div>'}fetch("deals.json?v="+Date.now()).then(r=>r.json()).then(d=>{deals=Array.isArray(d)?d:[];fill()}).catch(()=>out.innerHTML='<div class="row">Deal feed unavailable right now.</div>');A.addEventListener("change",render);B.addEventListener("change",render)</script></body></html>
