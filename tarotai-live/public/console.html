<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tarotai — autonomous AI command center</title>
<meta name="description" content="Private autonomous AI command center powered by a real server-side model and authorized tools.">
<style>
:root{--bg:#070a0f;--panel:#0d121a;--panel2:#101722;--line:#1e2733;--text:#edf2f7;--muted:#8e9aaa;--accent:#72e6b0;--accent2:#6fa8ff;--danger:#ff7b7b;--warn:#f5c46a;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0%,#182333 0,#070a0f 38%);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:235px minmax(420px,1fr) 310px;min-height:100vh}.side,.right,.top,.composer,.card,.login-card{background:rgba(13,18,26,.9);backdrop-filter:blur(12px)}.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}.right{border-left:1px solid var(--line);padding:18px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#72e6b0,#6fa8ff);color:#061018;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px}.new{width:100%;border:1px solid #2b3b4b;background:#131c27;color:var(--text);padding:10px 12px;border-radius:9px;text-align:left}.nav{margin-top:14px;display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aab6c4;text-align:left;padding:9px 10px;border-radius:8px}.nav button.active,.nav button:hover{background:#141e29;color:#fff}.nav span{display:inline-block;width:23px;color:#6f8194}.count{float:right;color:#6f8194}.sidefoot{margin-top:auto;color:#738194;font-size:12px;padding:13px 10px;border-top:1px solid var(--line)}.statusdot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:6px;box-shadow:0 0 10px var(--accent)}.main{display:flex;flex-direction:column;min-width:0}.top{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:16px;margin:0}.top .sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#0e151d;color:#b8c4d0;border-radius:8px;padding:7px 10px}.chat{flex:1;overflow:auto;padding:24px 7vw 160px}.welcome{max-width:850px;margin:40px auto}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}.welcome h2{font-size:39px;line-height:1.05;margin:8px 0}.welcome p{color:var(--muted);font-size:15px;max-width:620px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chip{border:1px solid var(--line);background:#0d141c;color:#bac6d1;border-radius:99px;padding:8px 11px}.msg{max-width:900px;margin:0 auto 18px}.bubble{padding:13px 15px;border:1px solid var(--line);border-radius:12px;white-space:pre-wrap}.msg.user .bubble{background:#111a24;border-color:#253448}.msg.ai .bubble{background:#0c131b}.label{color:#748396;font-size:11px;margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.1em}.tool{border-left:2px solid var(--accent2);margin-top:7px;background:#0a1017;padding:8px 10px;border-radius:7px;color:#93a1b0;font-size:12px}.composer-wrap{position:fixed;left:235px;right:310px;bottom:0;padding:18px max(20px,7vw);background:linear-gradient(transparent,rgba(7,10,15,.96) 25%)}.composer{border:1px solid #2a3745;border-radius:14px;box-shadow:var(--shadow);padding:10px}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);min-height:44px;max-height:180px;padding:8px}.composerbar{display:flex;justify-content:space-between;align-items:center}.hint{color:#677487;font-size:11px}.send{background:var(--accent);color:#061018;border:0;border-radius:8px;padding:8px 14px;font-weight:800}.send:disabled{opacity:.4}.section{margin-bottom:20px}.section h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#718096;margin:0 0 9px}.card{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:8px}.mini{color:var(--muted);font-size:12px}.step{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #17202a}.step:last-child{border-bottom:0}.badge{font-size:10px;border-radius:99px;padding:2px 6px;background:#16222e;color:#93a3b5}.source a{color:#9cc1ff;text-decoration:none}.source a:hover{text-decoration:underline}.mem{display:flex;gap:7px}.mem input{min-width:0;flex:1}.field{width:100%;background:#0a1118;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px}.danger{color:var(--danger)}.warn{color:var(--warn)}.ok{color:var(--accent)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);border:1px solid var(--line);padding:28px;border-radius:18px;box-shadow:var(--shadow)}.login-card h1{font-size:34px;margin:8px 0}.login-card p{color:var(--muted)}.login-card form{display:grid;gap:10px;margin-top:20px}.login-card .send{width:100%;padding:11px}.error{background:#2b1619;border:1px solid #5e2d33;color:#ffadb3;padding:9px;border-radius:8px}.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:1050px){.app{grid-template-columns:78px minmax(0,1fr)}.right{display:none}.brand div:not(.logo),.nav button b,.new span:last-child,.sidefoot{display:none}.new{font-size:0;text-align:center}.new span:first-child{font-size:20px}.nav button{text-align:center}.nav span{width:auto}.composer-wrap{left:78px;right:0;padding:14px 5vw}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.composer-wrap{left:0}.chat{padding:18px 14px 150px}.welcome h2{font-size:31px}.top{padding:12px 14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const state={messages:JSON.parse(localStorage.getItem('tarotai-messages')||'[]'),memory:JSON.parse(localStorage.getItem('tarotai-memory')||'[]'),tasks:JSON.parse(localStorage.getItem('tarotai-tasks')||'[]'),busy:false,auth:null,runtime:null,active:'Command Center',plan:[],activity:[],sources:[],documents:[],writeApproved:false};
const starter=['Diagnose my PC performance problem from everything you know about my setup.','Research a current topic and give me a source-backed answer.','Audit my project and tell me what I should work on next.'];
const nav=[['⌂','Command Center'],['＋','New Task'],['◉','Active Tasks'],['↺','Task History'],['▦','Projects'],['□','Files'],['◎','Memory'],['◈','Connected Apps'],['⚙','Settings']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('tarotai-messages',JSON.stringify(state.messages));localStorage.setItem('tarotai-memory',JSON.stringify(state.memory));localStorage.setItem('tarotai-tasks',JSON.stringify(state.tasks))}
function renderLogin(){const setup=state.runtime&&!state.runtime.hasAccessCode;document.getElementById('root').innerHTML='<div class="login"><div class="login-card"><div class="logo">T</div><div class="eyebrow" style="margin-top:14px">PRIVATE AI COMMAND CENTER</div><h1>tarotai</h1><p>A private server-side AI runtime. Access is fail-closed until the owner access code is configured.</p>'+(setup?'<div class="error">Private access is not configured yet. Set <b>TAROTAI_ACCESS_CODE</b> in Vercel Production, then redeploy.</div>':'')+'<div id="loginmsg"></div><form onsubmit="login(event)"><input id="code" class="field" type="password" placeholder="Access code" autofocus><button class="send">Enter workspace</button></form></div></div>'}
async function login(e){e.preventDefault();const code=document.getElementById('code').value;const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok){document.getElementById('loginmsg').innerHTML='<div class="error">'+esc(d.error||'Access denied')+'</div>';return}state.auth=true;render()}
function toolName(n){return n.replaceAll('_',' ')}
function render(){document.getElementById('root').innerHTML=`
<div class="app">
<aside class="side"><div class="brand"><div class="logo">T</div><div><b>tarotai</b><small>operator console</small></div></div><button class="new" onclick="newTask()"><span>＋</span><span> New task</span></button><div class="nav">${nav.map(([i,n])=>`<button class="${state.active===n?'active':''}" onclick="navTo('${n}')"><span>${i}</span><b>${esc(n)}</b>${n==='Active Tasks'?'<em class="count">'+state.tasks.filter(t=>t.status!=='completed').length+'</em>':''}</button>`).join('')}</div><div class="sidefoot"><span class="statusdot"></span><span id="runtimeStatus">Checking runtime…</span><br><button class="ghost" style="margin-top:8px;width:100%" onclick="lock()">Lock</button></div></aside>
<main class="main"><div class="top"><div><h1>${esc(state.active)}</h1><div class="sub">Understand → Plan → Execute → Observe → Adapt → Verify</div></div><div class="actions"><button class="ghost" onclick="clearChat()">Clear</button></div></div>
<div id="chat" class="chat">${chatHtml()}</div>
<div class="composer-wrap"><div class="composer"><textarea id="input" placeholder="Tell tarotai what you want done…" onkeydown="key(event)"></textarea><div class="composerbar"><div class="hint">${state.busy?'Agent is working…':'Enter to send • Shift+Enter for a new line'}</div><button class="send" onclick="send()" ${state.busy?'disabled':''}>${state.busy?'Working…':'Send'}</button></div></div></div></main>
<aside class="right">${rightHtml()}</aside>
</div>`;
document.getElementById('input')?.focus();scrollChat();ensureDocumentUi();ensureWriteUi();ensureCapabilitiesUi()}
function chatHtml(){if(!state.messages.length)return '<div class="welcome"><div class="eyebrow">PRIVATE AUTONOMOUS WORKSPACE</div><h2>What should tarotai do?</h2><p>This is the real runtime, not a simulation. It sends your request to the server-side model and can plan, research, read public pages, verify results and call an authorized executor.</p><div class="chips">'+starter.map(x=>'<button class="chip" onclick="prefill('+JSON.stringify(x)+')">'+esc(x)+'</button>').join('')+'</div></div>';return state.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}"><div class="label">${m.role==='user'?'You':'tarotai'}</div><div class="bubble">${esc(m.content||'')}</div>${(m.toolEvents||[]).map(t=>`<div class="tool">↳ ${esc(toolName(t.name))}</div>`).join('')}</div>`).join('')}
function rightHtml(){return '<div class="section"><h3>Task state</h3><div class="card"><div class="mini">'+(state.busy?'Executing':'Ready')+'</div><strong>'+(state.tasks[0]?esc(state.tasks[0].title):'No active task')+'</strong></div></div>'+
'<div class="section"><h3>Plan</h3><div class="card">'+(state.plan.length?state.plan.map((x,i)=>'<div class="step"><span class="badge">'+(i+1)+'</span><span>'+esc(x)+'</span></div>').join(''):'<div class="mini">The plan appears here when tarotai starts a substantial task.</div>')+'</div></div>'+
'<div class="section"><h3>Activity</h3><div class="card">'+(state.activity.length?state.activity.slice(0,8).map(x=>'<div class="step"><span>•</span><span>'+esc(x)+'</span></div>').join(''):'<div class="mini">No activity yet.</div>')+'</div></div>'+
'<div class="section"><h3>Sources</h3><div class="card">'+(state.sources.length?state.sources.slice(0,6).map(x=>'<div class="source step"><span>↗</span><span><a href="'+esc(x.url||'#')+'" target="_blank" rel="noreferrer">'+esc(x.title||x.url)+'</a><br><span class="mini">'+esc(x.snippet||'')+'</span></span></div>').join(''):'<div class="mini">Sources appear when web research is used.</div>')+'</div></div>'+
'<div class="section"><h3>Local notes</h3><div class="card"><div class="mem"><input id="mk" class="field" placeholder="Key"><input id="mv" class="field" placeholder="Value"></div><button class="ghost" style="margin-top:7px;width:100%" onclick="addMemory()">Save local note</button><div class="mini" style="margin-top:7px">Stored in this browser only; not sent to the server.</div>'+(state.memory.slice(0,8).map((m,i)=>'<div class="step"><span>•</span><span>'+esc(m.key)+': '+esc(m.value)+' <button class="ghost" style="padding:2px 5px" onclick="delMemory('+i+')">×</button></span></div>').join('')||'')+'</div></div>'+
'<div class="section"><h3>Security</h3><div class="card"><div class="mini">AI model: server-side<br>AI transport: direct OpenRouter<br>Web research: +(state.runtime?.hasExa?"Exa connected":"Exa not configured")+<br>Access code: +(state.runtime?.hasAccessCode?"configured":"MISSING — production is locked")+<br>Live tools: server-side only<br>API secrets: server environment only</div></div></div>'}
function ensureDocumentUi(){
  const sendButton=document.querySelector('.composerbar .send');
  if(!sendButton||document.getElementById('tarotai-doc-input'))return;
  const input=document.createElement('input');
  input.type='file';
  input.id='tarotai-doc-input';
  input.hidden=true;
  input.accept='.pdf,.docx,.pptx,.xlsx,.txt,.md,.markdown,.csv,.json,.xml,.html,.log,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  input.addEventListener('change',uploadDocument);
  document.body.appendChild(input);
  const button=document.createElement('button');
  button.className='ghost';
  button.type='button';
  button.textContent='Attach';
  button.title='Attach a PDF, DOCX, PPTX, XLSX or text document';
  button.addEventListener('click',()=>input.click());
  sendButton.parentElement.insertBefore(button,sendButton);

  const hint=document.querySelector('.composerbar .hint');
  const refresh=()=>{
    if(hint)hint.textContent=state.busy?'Agent is working…':(state.documents.length?('Attached '+state.documents.length+' document(s)'): 'Enter to send • Shift+Enter for a new line');
  };
  refresh();

  const right=document.querySelector('.right');
  if(right&&!document.getElementById('tarotai-doc-panel')){
    const section=document.createElement('div');
    section.className='section';
    section.id='tarotai-doc-panel';
    section.innerHTML='<h3>Documents</h3><div class="card" id="tarotai-doc-list"><div class="mini">No documents attached.</div></div>';
    right.insertBefore(section,right.firstChild);
  }
  const refreshDocs=()=>{
    const list=document.getElementById('tarotai-doc-list');
    if(!list)return;
    list.innerHTML=state.documents.length?state.documents.map((d,i)=>'<div class="step"><span>📄</span><span><strong>'+esc(d.name)+'</strong><br><span class="mini">'+esc(String(d.characters))+' chars'+(d.truncated?' • clipped':'')+'</span> <button class="ghost" style="padding:2px 5px" data-doc-remove="'+i+'">×</button></span></div>').join(''):'<div class="mini">No documents attached.</div>';
    list.querySelectorAll('[data-doc-remove]').forEach(b=>b.addEventListener('click',()=>{removeDocument(Number(b.dataset.docRemove));}));
  };
  refreshDocs();
  window.refreshTarotaiDocuments=()=>{refresh();refreshDocs();};
}
function ensureCapabilitiesUi(){
  const right=document.querySelector('.right');
  if(!right)return;
  let panel=document.getElementById('tarotai-capabilities-panel');
  if(!panel){
    panel=document.createElement('div');
    panel.className='section';
    panel.id='tarotai-capabilities-panel';
    panel.innerHTML='<h3>Capabilities</h3><div class="card" id="tarotai-capabilities-list"></div>';
    right.appendChild(panel);
  }
  const list=document.getElementById('tarotai-capabilities-list');
  if(!list)return;
  const r=state.runtime||{};
  const rows=[
    ['Internet research',r.hasExa?'Connected':'Not configured'],
    ['Documents',r.documentExtraction?'PDF • DOCX • PPTX • XLSX • text':'Unavailable'],
    ['GitHub read', 'Enabled'],
    ['GitHub write',r.githubWriteEnabled?'Server enabled • approval required':'Not configured'],
    ['Connected apps',r.hasComposio?'Composio ready':'Not configured'],
    ['Cybersecurity', 'Authorized defensive/learning mode']
  ];
  list.innerHTML=rows.map(([a,b])=>'<div class="step"><span class="badge">'+(b.includes('Connected')||b.includes('Enabled')||b.includes('ready')||b.includes('Authorized')?'ON':'—')+'</span><span><strong>'+esc(a)+'</strong><br><span class="mini">'+esc(b)+'</span></span></div>').join('');
}
function ensureWriteUi(){
  const sendButton=document.querySelector('.composerbar .send');
  if(!sendButton)return;
  let button=document.getElementById('tarotai-write-button');
  if(!button){
    button=document.createElement('button');
    button.className='ghost';
    button.id='tarotai-write-button';
    button.type='button';
    button.addEventListener('click',()=>{
      state.writeApproved=!state.writeApproved;
      ensureWriteUi();
    });
    sendButton.parentElement.insertBefore(button,sendButton);
  }
  button.textContent=state.writeApproved?'Write ON':'Write OFF';
  button.title=state.writeApproved?'GitHub write actions are approved for this session.':'Read-only mode. Click to allow guarded GitHub write actions for this session.';
  button.style.borderColor=state.writeApproved?'#72e6b0':'#1e2733';
  button.style.color=state.writeApproved?'#72e6b0':'#b8c4d0';

  const right=document.querySelector('.right');
  if(right&&!document.getElementById('tarotai-permissions-panel')){
    const section=document.createElement('div');
    section.className='section';
    section.id='tarotai-permissions-panel';
    section.innerHTML='<h3>Execution permissions</h3><div class="card"><div class="mini">GitHub writes require both a server-side GitHub token and this session switch.</div><button class="ghost" id="tarotai-permission-toggle" style="margin-top:8px;width:100%"></button></div>';
    right.prepend(section);
  }
  const toggle=document.getElementById('tarotai-permission-toggle');
  if(toggle){
    toggle.textContent=state.writeApproved?'Disable write mode':'Enable write mode';
    toggle.onclick=()=>{state.writeApproved=!state.writeApproved;ensureWriteUi();};
  }
}
async function uploadDocument(e){
  const file=e.target.files?.[0];
  e.target.value='';
  if(!file||state.busy)return;
  if(state.documents.length>=4){alert('Maximum 4 documents per task.');return;}
  state.activity.unshift('Extracting document: '+file.name);
  if(window.refreshTarotaiDocuments)window.refreshTarotaiDocuments();
  try{
    const form=new FormData();
    form.append('file',file);
    const r=await fetch('/api/documents',{method:'POST',body:form});
    const raw=await r.text();
    let d;
    try{d=raw?JSON.parse(raw):{};}catch{throw new Error(raw.slice(0,500)||('HTTP '+r.status));}
    if(!r.ok)throw new Error(d.error||('Document upload failed (HTTP '+r.status+')'));
    state.documents.push({name:d.name,mime:d.mime,characters:d.characters,truncated:d.truncated,text:d.text});
    state.activity.unshift('Document ready: '+d.name+(d.warning?' • '+d.warning:''));
    if(window.refreshTarotaiDocuments)window.refreshTarotaiDocuments();
  }catch(err){
    state.activity.unshift('Document failed: '+err.message);
    if(window.refreshTarotaiDocuments)window.refreshTarotaiDocuments();
    alert(err.message);
  }
}
function removeDocument(i){state.documents.splice(i,1);state.activity.unshift('Removed document attachment');if(window.refreshTarotaiDocuments)window.refreshTarotaiDocuments();render()}
function navTo(n){state.active=n;render()}
function prefill(x){document.getElementById('input').value=x;document.getElementById('input').focus()}
function newTask(){state.active='New Task';document.getElementById('input')?.focus();render()}
function clearChat(){state.messages=[];state.plan=[];state.sources=[];state.activity=[];state.documents=[];save();render()}
function addMemory(){const k=document.getElementById('mk').value.trim(),v=document.getElementById('mv').value.trim();if(!k||!v)return;state.memory.unshift({key:k,value:v});save();render()}
function delMemory(i){state.memory.splice(i,1);save();render()}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function scrollChat(){const el=document.getElementById('chat');if(el)el.scrollTop=el.scrollHeight}
async function send(){const box=document.getElementById('input');const text=box?.value.trim();if(!text||state.busy)return;state.busy=true;state.messages.push({role:'user',content:text});state.tasks.unshift({title:text,status:'executing',createdAt:new Date().toISOString()});state.activity.unshift('Task started: '+text);save();render();try{const reqHeaders={'content-type':'application/json'};if(state.writeApproved)reqHeaders['x-tarotai-write-approval']='confirm';const r=await fetch('/api/chat',{method:'POST',headers:reqHeaders,body:JSON.stringify({messages:state.messages.map(m=>({role:m.role,content:m.content})),documents:state.documents.map(d=>({name:d.name,mime:d.mime,characters:d.characters,truncated:d.truncated,text:d.text}))})});const raw=await r.text();let d;try{d=raw?JSON.parse(raw):{}}catch{throw new Error(raw.slice(0,500)||`HTTP ${r.status}`)}if(!r.ok)throw new Error(d.error||`Request failed (HTTP ${r.status})`);state.messages.push({role:'assistant',content:d.text,toolEvents:d.toolEvents||[]});state.activity.unshift(d.toolEvents?.length?'Used '+d.toolEvents.length+' tool step(s)':'Answered directly');for(const t of (d.toolEvents||[])){if(t.output?.type==='plan')state.plan=t.output.steps||[];if(t.output?.type==='web_search'&&t.output.results)state.sources=t.output.results;state.activity.unshift('Used '+toolName(t.name));}state.tasks[0].status='completed';state.tasks[0].result=d.text;save()}catch(e){state.messages.push({role:'assistant',content:'I could not complete the request. '+e.message});if(state.tasks[0])state.tasks[0].status='failed';save()}state.busy=false;render()}
async function lock(){await fetch('/api/auth',{method:'DELETE'});location.reload()}
async function boot(){try{const h=await fetch('/api/health',{cache:'no-store'});state.runtime=await h.json().catch(()=>null)}catch{state.runtime=null}const r=await fetch('/api/auth',{cache:'no-store'});const d=await r.json();state.auth=d.authenticated;if(!state.auth){renderLogin();return}render();const el=document.getElementById('runtimeStatus');if(el){el.textContent=!state.runtime?.hasAccessCode?'SECURITY SETUP REQUIRED':(state.runtime?.hasOpenRouterKey?(state.runtime?.hasExa?'AI runtime connected':'AI key connected • Exa not configured'):'AI runtime needs configuration');}}
boot();
</script>
</body>
</html>
